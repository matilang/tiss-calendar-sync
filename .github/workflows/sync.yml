name: TISS calendar sync

# Runs the sync without your laptop being on.
#
# The settings - courses, titles, reminders, retention - come from settings.toml and
# settings.tuwel.toml in this repository, so changing them is an ordinary commit. Only
# the private values are secrets:
#
#   SERVICE_ACCOUNT_JSON  - the whole contents of service_account.json
#   TISS_ICAL_URL         - the TISS iCal link (its token is the secret)
#   GOOGLE_CALENDAR_ID    - the target calendar's id
#   TUWEL_ICAL_URL        - the TUWEL export link (optional; leave unset and the TUWEL
#                           step is skipped)
#
# Settings -> Secrets and variables -> Actions -> New repository secret.
#
# This replaced an earlier arrangement where the whole of config.toml and tuwel.toml were
# pasted into CONFIG_TOML / TUWEL_TOML secrets. That worked, but every settings change had
# to be made twice - once in the file, once in the secret - and forgetting the second half
# left the cloud quietly running an older course list. Those two secrets are no longer
# read and can be deleted.
#
# The repository should still be private: settings.toml names the courses you take.

on:
  schedule:
    # 05:00 UTC. GitHub cron has no daylight saving, so this lands at 07:00 Vienna time
    # in summer and 06:00 in winter. Runs are also commonly 5-30 min late at peak hours,
    # which does not matter for a once-a-day job.
    - cron: "0 5 * * *"
  # Lets you trigger it by hand from the Actions tab - use this for the first test.
  workflow_dispatch:

concurrency:
  # Never let two syncs overlap; they would fight over the same events.
  group: tiss-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11+ required: the script reads its config with tomllib.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Restore the service account key
        id: creds
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          TISS_ICAL_URL: ${{ secrets.TISS_ICAL_URL }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TUWEL_ICAL_URL: ${{ secrets.TUWEL_ICAL_URL }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$SERVICE_ACCOUNT_JSON" ] || missing="$missing SERVICE_ACCOUNT_JSON"
          [ -n "$TISS_ICAL_URL" ]        || missing="$missing TISS_ICAL_URL"
          [ -n "$GOOGLE_CALENDAR_ID" ]   || missing="$missing GOOGLE_CALENDAR_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing required secret(s):$missing - add them under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # printf '%s', not echo: keeps the JSON byte-exact and adds no stray newline.
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          # Fail early and clearly if the key was pasted truncated or mangled.
          python -c "import json; json.load(open('service_account.json'))"
          echo "key parsed cleanly"
          if [ -n "$TUWEL_ICAL_URL" ]; then
            echo "tuwel=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync TISS lectures, exams and registration reminders
        env:
          # The secrets reach the sync through the environment, which takes precedence
          # over .secrets.toml - the file that does not exist here, and should not.
          TISSCAL_ICAL_URL: ${{ secrets.TISS_ICAL_URL }}
          TISSCAL_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python tiss_sync.py sync -c settings.toml

      - name: Sync TUWEL deadlines
        if: steps.creds.outputs.tuwel == 'yes'
        env:
          TISSCAL_ICAL_URL: ${{ secrets.TUWEL_ICAL_URL }}
          TISSCAL_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python tiss_sync.py sync -c settings.tuwel.toml

      - name: Shred the key
        # always(): it must not survive a failed run either.
        if: always()
        run: rm -f service_account.json
