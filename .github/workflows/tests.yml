name: tests

# Separate from sync.yml on purpose: these tests need no secrets and no network, so they
# can run on every push and on pull requests without touching the calendar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); 3.13 guards against the next version breaking us.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Check the example config stays loadable and complete
        # It is the entry point for a fresh setup, and it silently rotted once already.
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          sys.path.insert(0, ".")
          from tiss_sync import load_config
          example = tomllib.loads(
              pathlib.Path("config.example.toml").read_text(encoding="utf-8"))
          cfg = load_config(pathlib.Path("config.example.toml"))
          for section in ("titles", "exercises", "scrape", "retention", "reminders"):
              assert section in example, f"[{section}] missing from config.example.toml"
          print("config.example.toml loads and documents every section")
          PY
