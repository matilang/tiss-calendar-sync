# Copy to .secrets.toml and fill in. .secrets.toml is git-ignored; this file is not,
# so never put a real token here.
#
# Only private values belong in this file: the iCal URLs, whose query strings carry a
# TISS feed token or a TUWEL authtoken, and the calendar id. Courses, titles, reminders
# and everything else live in settings.toml, in git.
#
# Precedence, highest first:
#   1. the environment  - TISSCAL_ICAL_URL, TISSCAL_CALENDAR_ID
#   2. this file        - a [profile] section, or a bare key shared by all profiles
#   3. the settings file itself, which is how a single-file config from before the
#      split keeps working
#
# A third private thing, the service account key, stays a file: service_account.json in
# the repository directory, or anywhere you like if you point TISSCAL_SERVICE_ACCOUNT
# at it.

# Google Calendar -> Settings -> your calendar -> "Calendar ID".
# Strongly recommended: a separate calendar, so a bug can never touch your real one.
calendar_id = "xxxxxxxx@group.calendar.google.com"

[config]
# TISS -> Calendar -> "iCal export" / subscribe link. The token in it is the secret.
ical_url = "https://tiss.tuwien.ac.at/events/rest/calendar/personal?locale=en&token=PASTE"

[tuwel]
# TUWEL -> Calendar -> "Export calendar" -> Events related to courses, custom range,
# then "Get calendar URL". The authtoken is password-equivalent.
ical_url = "https://tuwel.tuwien.ac.at/calendar/export_execute.php?userid=PASTE&authtoken=PASTE&preset_what=courses&preset_time=custom"
