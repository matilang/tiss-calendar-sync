<!-- The interface. One file: no build step, no bundler, no CDN.
     Everything that decides anything lives in Python; this draws it and sends it back. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TU Wien calendar sync</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --line: #e3e2df; --ink: #1c1c1a; --dim: #6c6b67;
    --accent: #2b5d8a; --add: #1a7f45; --del: #a62b2b; --mod: #8a5a10;
    --add-bg: #eaf6ee; --del-bg: #fbecec; --mod-bg: #fcf4e6; --warn-bg: #fdf6e0;
    --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --line: #32343a; --ink: #e8e8e6; --dim: #9a9b98;
      --accent: #7fb0dd; --add: #65d394; --del: #ef8e8e; --mod: #e0b964;
      --add-bg: #16291f; --del-bg: #2b1a1a; --mod-bg: #2a2317; --warn-bg: #2b2616;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 20px 120px; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
           padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .meta { color: var(--dim); font-size: 12.5px; font-family: var(--mono); }
  .grow { flex: 1; }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 26px 0 10px; font-weight: 650; }

  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 7px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; font-size: 11px; color: var(--dim);
       text-transform: uppercase; letter-spacing: .05em;
       padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.mid, th.mid { text-align: center; }
  .nr { font-family: var(--mono); color: var(--dim); }
  tr.off td:not(.mid) { opacity: .5; }
  tr.new-course { background: var(--warn-bg); }

  input[type=text], input[type=number] {
    font: inherit; font-family: var(--mono); font-size: 12.5px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; width: 100%;
  }
  input[type=text]:focus, input[type=number]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  label.row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label.row span.hint { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }

  .switches { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
              gap: 10px 26px; padding: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }

  button {
    font: inherit; font-weight: 550; padding: 6px 13px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); color: #fff; }

  /* ---- diff ---- */
  .counts { display: flex; gap: 16px; align-items: center; font-family: var(--mono);
            font-size: 13px; padding: 11px 16px; border-bottom: 1px solid var(--line);
            flex-wrap: wrap; }
  .c-add { color: var(--add); } .c-del { color: var(--del); } .c-mod { color: var(--mod); }
  .changes { max-height: 42vh; overflow: auto; }
  .chg { display: grid; grid-template-columns: 18px 128px 1fr auto;
         gap: 10px; align-items: baseline; padding: 4px 16px;
         font-family: var(--mono); font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .chg:last-child { border-bottom: 0; }
  .chg.created { background: var(--add-bg); } .chg.created .mark { color: var(--add); }
  .chg.deleted { background: var(--del-bg); } .chg.deleted .mark { color: var(--del); }
  .chg.updated { background: var(--mod-bg); } .chg.updated .mark { color: var(--mod); }
  .chg .mark { font-weight: 700; }
  .chg .when { color: var(--dim); }
  .chg .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chg .fields { color: var(--dim); font-size: 11.5px; }
  .empty { padding: 20px 16px; color: var(--dim); }

  /* ---- month grid ---- */
  .viewbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
             border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .viewbar button { padding: 3px 9px; font-size: 12.5px; }
  .months { display: flex; gap: 3px; flex-wrap: wrap; }
  .months button { font-family: var(--mono); font-size: 12px; padding: 3px 8px;
                   border-color: transparent; }
  .months button.on { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .months button .yr { opacity: .45; padding-left: 2px; font-size: 10.5px; }
  .months button .n { font-size: 10px; font-weight: 700; margin-left: 5px;
                      padding: 0 5px; border-radius: 7px; vertical-align: 1px;
                      background: color-mix(in srgb, var(--mod) 30%, transparent); }
  .legend { display: flex; gap: 11px; font-size: 11.5px; color: var(--dim); }
  .legend .key::before { content: ""; display: inline-block; width: 9px; height: 9px;
                         border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .legend .created::before { background: var(--add); }
  .legend .deleted::before { background: var(--del); }
  .legend .updated::before { background: var(--mod); }

  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid .dow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
               color: var(--dim); text-align: center; padding: 6px 0;
               border-bottom: 1px solid var(--line); font-weight: 650; }
  .day { min-height: 86px; padding: 4px 5px 6px; border-right: 1px solid var(--line);
         border-bottom: 1px solid var(--line); display: flex; flex-direction: column;
         gap: 3px; min-width: 0; }
  .day:nth-child(7n + 7) { border-right: 0; }
  .day.outside { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .day.outside .dnum { opacity: .35; }
  .day.weekend .dnum { color: var(--dim); }
  .dnum { font-family: var(--mono); font-size: 11.5px; color: var(--dim);
          font-variant-numeric: tabular-nums; }
  .day.today .dnum { background: var(--accent); color: #fff; border-radius: 3px;
                     padding: 0 4px; align-self: flex-start; font-weight: 700; }

  .chip { font-size: 11px; line-height: 1.35; padding: 2px 5px; border-radius: 3px;
          border-left: 3px solid var(--chip, var(--dim));
          background: color-mix(in srgb, var(--chip, var(--dim)) 14%, transparent);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  .chip .t { font-family: var(--mono); opacity: .75; padding-right: 3px; }
  .chip.created { box-shadow: inset 0 0 0 1.5px var(--add); }
  .chip.updated { box-shadow: inset 0 0 0 1.5px var(--mod); }
  .chip.deleted { opacity: .5; text-decoration: line-through;
                  box-shadow: inset 0 0 0 1.5px var(--del); }
  .chip .mk { font-weight: 800; padding-right: 2px; }
  .chip.created .mk { color: var(--add); }
  .chip.updated .mk { color: var(--mod); }
  .chip.deleted .mk { color: var(--del); }

  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 10px; }
    .day { min-height: 60px; }
  }

  /* ---- bottom bar ---- */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
         border-top: 1px solid var(--line); padding: 10px 20px;
         display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bar .state { font-family: var(--mono); font-size: 12.5px; }
  .warn { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 5px;
          padding: 7px 11px; font-size: 12.5px; }
  .err { background: var(--del-bg); color: var(--del); border: 1px solid var(--del);
         border-radius: 5px; padding: 9px 12px; margin: 12px 0; font-size: 13px;
         white-space: pre-wrap; font-family: var(--mono); }
  pre.gitlog { background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
               padding: 10px; font-size: 11.5px; overflow: auto; max-height: 180px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--dim); margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--add); } .dot.off { background: var(--del); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TU Wien calendar sync</h1>
    <span class="meta" id="hdr"></span>
    <span class="grow"></span>
    <span class="meta" id="cacheAge"></span>
    <button id="refresh" title="Re-fetch the feed and the TISS course pages">Refresh data</button>
  </header>

  <div id="error" class="err" style="display:none"></div>
  <div id="notice"></div>

  <h2>Courses in the feed</h2>
  <div class="panel"><table>
    <thead><tr>
      <th class="mid" title="Keep this course's events on the calendar">Sync</th>
      <th class="mid" title="Read this course's TISS page for exam dates and registration windows">Scrape</th>
      <th>Course</th><th>Calendar name</th>
      <th class="num" title="Events this course has in the TISS iCal feed">Feed</th>
      <th class="num" title="Events it would have on the calendar. Can exceed the feed count: exams and registration reminders are read off the course page, not the feed.">Calendar</th>
      <th>Next</th>
    </tr></thead>
    <tbody id="courses"></tbody>
  </table></div>

  <h2>What gets synced</h2>
  <div class="panel"><div class="switches" id="switches"></div></div>

  <h2>Your calendar, and what your edits would do to it
      <span id="diffScope" class="meta"></span></h2>
  <div class="panel">
    <div class="counts" id="counts"></div>
    <div class="viewbar">
      <button id="prevMonth" title="Previous month">◀</button>
      <div class="months" id="months"></div>
      <button id="nextMonth" title="Next month">▶</button>
      <span class="grow"></span>
      <span class="legend">
        <span class="key created">added</span>
        <span class="key deleted">removed</span>
        <span class="key updated">changed</span>
      </span>
      <button id="viewToggle" title="Switch between the month grid and a flat list">As a list</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="changes" id="changes" hidden></div>
  </div>

  <h2>Git</h2>
  <div class="panel" style="padding:14px 16px">
    <div id="git"></div>
    <pre class="gitlog" id="gitlog" style="display:none"></pre>
  </div>
</div>

<div class="bar">
  <span class="state" id="dirty">loading…</span>
  <span class="grow"></span>
  <button id="discard" disabled>Discard edits</button>
  <button id="save" class="primary" disabled>Apply to settings.toml</button>
</div>

<script>
"use strict";

// The entry in `courses` that keeps the TISS holiday and break markers. They carry no
// course number, so they are matched by this fragment of their title.
const HOLIDAY_FILTER = "no lectures";

let state = null;      // as the server last reported it
let draft = null;      // what the page has, before Apply
let diffTimer = null;

const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

async function call(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({error: res.statusText}));
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.data = data; throw e; }
  return data;
}

function showError(msg) {
  const box = $("error");
  if (!msg) { box.style.display = "none"; return; }
  box.textContent = msg;
  box.style.display = "block";
}

// ---- draft accessors -------------------------------------------------------
// The draft mirrors the TOML document, so a path is just section.key. Keeping it in that
// shape means the server can hand it straight to from_dict with nothing in between.
function get(path) {
  return path.split(".").reduce((o, k) => (o === undefined ? o : o[k]), draft);
}
function put(path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  let o = draft;
  for (const k of keys) { if (o[k] === undefined || o[k] === null) o[k] = {}; o = o[k]; }
  o[last] = value;
  changed();
}
function inList(path, value) {
  const list = get(path) || [];
  return list.includes(value);
}
function toggleList(path, value, on) {
  const list = (get(path) || []).slice();
  const at = list.indexOf(value);
  if (on && at < 0) list.push(value);
  if (!on && at >= 0) list.splice(at, 1);
  put(path, list);
}

// ---- rendering -------------------------------------------------------------
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function weekdayOf(day) {
  // Noon UTC, so the weekday of a calendar date is the same wherever this is read.
  return WEEKDAYS[new Date(`${day}T12:00:00Z`).getUTCDay()];
}

function fmtWhen(iso) {
  if (!iso) return "";
  // Read straight off the ISO string, which carries Vienna's date and time, so this agrees
  // with the grid - which places a chip by the same string - no matter where the browser is.
  const day = iso.slice(0, 10);
  if (day.length < 10) return iso;
  const time = iso.length > 10 ? ` ${iso.slice(11, 16)}` : "";
  return `${weekdayOf(day)} ${day.slice(8)}.${day.slice(5, 7)}${time}`;
}

function renderHeader() {
  $("hdr").textContent =
    `${state.file} · profile ${state.profile} · ${state.events} events`;
  const ages = Object.values(state.cache);
  const oldest = ages.length ? Math.max(...ages) : null;
  $("cacheAge").textContent = oldest === null ? "nothing cached"
    : `data fetched ${oldest < 90 ? oldest + "s" : Math.round(oldest / 60) + " min"} ago`;

  const notes = [];
  if (!state.secrets.calendar_id)
    notes.push("No calendar id is set, so nothing can be synced yet - put it in .secrets.toml.");
  if (!state.secrets.ical_url)
    notes.push("No feed URL is set.");
  $("notice").innerHTML = notes.map((n) => `<div class="warn">${n}</div>`).join("");
}

function renderCourses() {
  const body = $("courses");
  body.innerHTML = "";
  for (const c of state.courses) {
    const nr = c.course_nr;
    const tr = document.createElement("tr");
    // The holiday markers have no course number, so they are kept by a title fragment
    // instead. Same checkbox, different entry - there is no reason to make the one row you
    // cannot tick the one row you have to type for.
    const filter = nr || HOLIDAY_FILTER;
    const configured = inList("courses", filter);
    if (!configured) tr.classList.add("off");
    if (!c.in_config && nr) tr.classList.add("new-course");

    // Sync
    const sync = document.createElement("td"); sync.className = "mid";
    sync.appendChild(checkbox(configured, (on) => toggleList("courses", filter, on)));
    tr.appendChild(sync);

    // Scrape - only courses with a number have a TISS page to read
    const scr = document.createElement("td"); scr.className = "mid";
    if (nr) {
      const bare = nr.replace(".", "");
      scr.appendChild(checkbox(inList("scrape.courses", bare),
        (on) => toggleList("scrape.courses", bare, on)));
    }
    tr.appendChild(scr);

    const name = document.createElement("td");
    name.innerHTML = nr
      ? `<span class="nr">${nr}</span>`
      : `<span class="nr" title="Kept by the title fragment ${HOLIDAY_FILTER}">` +
        `holidays</span>`;
    tr.appendChild(name);

    const label = document.createElement("td");
    if (nr) {
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = c.feed_title.replace(nr, "").trim().slice(0, 40);
      input.value = (draft.titles || {})[nr] || "";
      input.addEventListener("input", () => {
        const titles = Object.assign({}, draft.titles || {});
        if (input.value.trim()) titles[nr] = input.value.trim(); else delete titles[nr];
        put("titles", titles);
      });
      label.appendChild(input);
    } else {
      label.innerHTML = `<span class="meta">${c.feed_title.slice(0, 40)}</span>`;
    }
    tr.appendChild(label);

    const scraped = c.scraped
      ? `<span style="opacity:.6" title="${c.scraped} from the course page, not the feed">` +
        `+${c.scraped}</span>`
      : "";
    tr.insertAdjacentHTML("beforeend",
      `<td class="num">${c.in_feed}</td>` +
      `<td class="num">${c.synced - c.scraped}${scraped}</td>` +
      `<td class="meta">${fmtWhen(c.next)}</td>`);
    body.appendChild(tr);
  }
}

function checkbox(on, onChange) {
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = !!on;
  input.addEventListener("change", () => onChange(input.checked));
  return input;
}

function boolSwitch(label, path, hint) {
  const el = document.createElement("label");
  el.className = "row";
  el.appendChild(checkbox(get(path), (on) => put(path, on)));
  el.insertAdjacentHTML("beforeend",
    `<span>${label}</span><span class="hint">${hint || path}</span>`);
  return el;
}

function listField(label, path, hint) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.innerHTML = `<span>${label} <em style="opacity:.7">${hint || path}</em></span>`;
  const input = document.createElement("input");
  input.type = "text";
  input.value = (get(path) || []).join(", ");
  input.addEventListener("change", () => {
    const parts = input.value.split(",").map((s) => s.trim()).filter(Boolean);
    const nums = parts.every((p) => /^-?\d+$/.test(p));
    put(path, nums ? parts.map(Number) : parts);
  });
  wrap.appendChild(input);
  return wrap;
}

function numberField(label, path, hint) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.innerHTML = `<span>${label} <em style="opacity:.7">${hint || path}</em></span>`;
  const input = document.createElement("input");
  input.type = "number"; input.step = "0.5"; input.min = "0";
  input.value = get(path);
  input.addEventListener("change", () => put(path, Number(input.value)));
  wrap.appendChild(input);
  return wrap;
}

function renderSwitches() {
  const box = $("switches");
  box.innerHTML = "";
  box.append(
    boolSwitch("Merge events sharing a time and room", "merge_parallel_rooms"),
    boolSwitch("Delete events once they are past", "retention.prune_past"),
    boolSwitch("Remind before a registration window closes",
               "scrape.registration_close_reminder"),
    numberField("Placeholder threshold (hours)", "placeholder_min_hours"),
    listField("Lecture reminders (minutes before)", "reminders.lecture_minutes_before"),
    listField("Exam reminders (minutes before)", "reminders.exam_minutes_before"),
    listField("Registration reminders", "reminders.registration_minutes_before"),
    listField("Registration kinds to remind about", "scrape.registration_kinds"),
    listField("Dropped if the title contains", "exclude_keywords"),
  );

  // Everything in `courses` is a checkbox in the table above, except anything that is
  // neither a course number from the feed nor the holiday fragment. That should normally be
  // empty; if it is not, it still has to be editable, so the field appears only then.
  const known = new Set(state.courses.map((c) => c.course_nr).filter(Boolean));
  known.add(HOLIDAY_FILTER);
  const leftovers = (get("courses") || []).filter((c) => !known.has(c));
  if (leftovers.length) {
    box.appendChild(listField(
      "Course filters with no row above", "courses",
      `courses — ${leftovers.join(", ")}`));
  }
}

// Google's own palette, so a chip here is the colour the event has in Google Calendar.
const GOOGLE_COLOURS = {
  "1": "#7986cb", "2": "#33b679", "3": "#8e24aa", "4": "#e67c73", "5": "#f6bf26",
  "6": "#f4511e", "7": "#039be5", "8": "#616161", "9": "#3f51b5", "10": "#0b8043",
  "11": "#d50000",
};
const NO_COLOUR = "#5b7fa6";          // a lecture: the calendar's own default
const MARKS = {created: "+", deleted: "−", updated: "~"};

let lastDiff = null;        // the diff the board is drawn from
let shownMonth = null;      // "YYYY-MM"
let asList = false;

const pad = (n) => String(n).padStart(2, "0");
const dayOf = (iso) => (iso || "").slice(0, 10);
const monthOf = (iso) => (iso || "").slice(0, 7);
const keyOfDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

// The mirror of web.event_row, so an added event is drawn exactly like an existing one.
function rowFromBody(id, body) {
  const s = (body && body.start) || {}, e = (body && body.end) || {};
  return {
    id, title: (body && body.summary) || "", location: (body && body.location) || "",
    colour: (body && body.colorId) || null,
    start: s.dateTime || s.date || "", end: e.dateTime || e.date || "",
    all_day: "date" in s,
  };
}

/** The calendar as it is, with this draft's changes laid over it.
 *
 * The baseline is the settings file on disk - what you would get by not touching anything -
 * and the overlay is vs_file, which is what Apply would do. Those two have to be the same
 * question or the grid would be drawing one state and marking up another. */
function boardRows() {
  const rows = new Map();
  for (const e of state.calendar || []) rows.set(e.id, {...e, diff: "same"});
  const plan = lastDiff && lastDiff.vs_file;
  for (const ch of (plan ? plan.changes : [])) {
    const body = ch.kind === "deleted" ? ch.before : ch.after;
    rows.set(ch.id, {...rowFromBody(ch.id, body), diff: ch.kind, fields: ch.fields});
  }
  return [...rows.values()];
}

function monthsOf(rows) {
  const months = new Map();
  for (const r of rows) {
    const key = monthOf(r.start);
    if (!key) continue;
    const m = months.get(key) || {key, total: 0, changed: 0};
    m.total += 1;
    if (r.diff !== "same") m.changed += 1;
    months.set(key, m);
  }
  return [...months.values()].sort((a, b) => a.key.localeCompare(b.key));
}

function monthName(key) {
  const [y, m] = key.split("-").map(Number);
  // en-GB, not the browser's locale. Passing undefined takes the machine's language, which
  // put Polish month names next to the hard-coded English weekday headers - and every other
  // label on this page is English too. One language or the other, not half of each.
  const name = new Date(y, m - 1, 1).toLocaleString("en-GB", {month: "short"});
  // The year is dimmed rather than dropped: a semester spans a new year, and "sty" next to
  // "paź" without one is ambiguous exactly when it matters.
  return `${name}<span class="yr">${String(y).slice(2)}</span>`;
}

function chipHtml(r) {
  const colour = GOOGLE_COLOURS[r.colour] || NO_COLOUR;
  const time = r.all_day ? "" : `<span class="t">${r.start.slice(11, 16)}</span>`;
  const mark = MARKS[r.diff] ? `<span class="mk">${MARKS[r.diff]}</span>` : "";
  const when = r.all_day ? "all day"
    : `${r.start.slice(11, 16)}–${(r.end || "").slice(11, 16)}`;
  const note = {created: "would be added", deleted: "would be removed",
                updated: `would change: ${(r.fields || []).join(", ")}`}[r.diff] || "";
  const tip = [r.title, when, r.location, note].filter(Boolean).join("\n");
  return `<div class="chip ${r.diff}" style="--chip:${colour}" title="${escapeHtml(tip)}">` +
         `${mark}${time}${escapeHtml(r.title)}</div>`;
}

function renderBoard() {
  const rows = boardRows();
  const months = monthsOf(rows);

  // Land where the change is. Only when the month on screen has none of it - otherwise
  // every keystroke would yank the view away from what you were looking at.
  const current = months.find((m) => m.key === shownMonth);
  const changed = months.filter((m) => m.changed);
  if (!current) shownMonth = (changed[0] || months[0] || {}).key || monthOf(new Date().toISOString());
  else if (changed.length && !current.changed) shownMonth = changed[0].key;

  $("months").innerHTML = months.map((m) => `
    <button data-month="${m.key}" class="${m.key === shownMonth ? "on" : ""}"
            title="${m.total} events${m.changed ? `, ${m.changed} changing` : ""}">
      ${monthName(m.key)}${m.changed ? `<span class="n c-mod">${m.changed}</span>` : ""}
    </button>`).join("");
  for (const b of $("months").querySelectorAll("button")) {
    b.addEventListener("click", () => { shownMonth = b.dataset.month; renderBoard(); });
  }

  renderGrid(rows);
  renderList();
}

function renderGrid(rows) {
  const box = $("grid");
  if (!shownMonth) { box.innerHTML = `<div class="empty">nothing to show</div>`; return; }

  const byDay = new Map();
  for (const r of rows) {
    const key = dayOf(r.start);
    if (!key) continue;
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(r);
  }
  for (const list of byDay.values()) {
    list.sort((a, b) => (b.all_day - a.all_day) || a.start.localeCompare(b.start));
  }

  const [y, m] = shownMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;            // Monday-first
  const days = new Date(y, m, 0).getDate();
  const cells = Math.ceil((lead + days) / 7) * 7;
  const today = keyOfDate(new Date());

  const names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  let html = names.map((n) => `<div class="dow">${n}</div>`).join("");

  for (let i = 0; i < cells; i++) {
    const date = new Date(y, m - 1, 1 - lead + i);
    const key = keyOfDate(date);
    const classes = ["day"];
    if (date.getMonth() !== m - 1) classes.push("outside");
    if (date.getDay() === 0 || date.getDay() === 6) classes.push("weekend");
    if (key === today) classes.push("today");
    const chips = (byDay.get(key) || []).map(chipHtml).join("");
    html += `<div class="${classes.join(" ")}"><span class="dnum">${date.getDate()}</span>${chips}</div>`;
  }
  box.innerHTML = html;
}

function renderList() {
  const plan = lastDiff && lastDiff.vs_file;
  const box = $("changes");
  if (!plan || !plan.changes.length) {
    box.innerHTML = `<div class="empty">Nothing would change, so there is nothing to list.</div>`;
    return;
  }
  box.innerHTML = plan.changes.map((ch) => `
    <div class="chg ${ch.kind}" title="${ch.id}">
      <span class="mark">${MARKS[ch.kind]}</span>
      <span class="when">${fmtWhen(ch.start)}</span>
      <span class="what">${escapeHtml(ch.title)}${
        ch.location ? ` <span style="opacity:.6">· ${escapeHtml(ch.location)}</span>` : ""}</span>
      <span class="fields">${ch.fields.join(", ")}</span>
    </div>`).join("") + (plan.truncated
      ? `<div class="empty">…more changes than are worth listing</div>` : "");
}

function renderCounts() {
  const plan = lastDiff && lastDiff.vs_file;
  const box = $("counts");
  if (!plan) { box.innerHTML = `<span style="color:var(--dim)">working it out…</span>`; return; }

  const c = plan.counts;
  if (!(c.created + c.deleted + c.updated)) {
    box.innerHTML = `<span style="color:var(--dim)">No change — ` +
      `${c.unchanged} events either way.</span>`;
    return;
  }
  const bits = [];
  if (c.created) bits.push(`<span class="c-add">add ${c.created}</span>`);
  if (c.deleted) bits.push(`<span class="c-del">remove ${c.deleted}</span>`);
  if (c.updated) bits.push(`<span class="c-mod">change ${c.updated}</span>`);
  box.innerHTML = `<span>Applying this would ${bits.join(", ")}.</span>` +
    `<span style="color:var(--dim)">· ${c.unchanged} events stay as they are.</span>`;
}

function renderDiff(data) {
  lastDiff = data;
  // A settings file from before an option was renamed or removed no longer loads, which
  // costs the comparison against git and nothing else. Say so rather than show nothing.
  const scope = $("diffScope");
  scope.title = (data && data.vs_head_error) || "";
  scope.textContent = data && data.vs_head_error
    ? `— ${data.vs_head_error.slice(0, 76)}` : "";
  renderCounts();
  renderBoard();
  renderGit();            // the cloud's lag comes from the same payload
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
}

function renderGit() {
  const g = state.git;
  const box = $("git");
  if (!g.available) { box.innerHTML = `<span class="meta">not a git working copy</span>`; return; }

  const dirty = g.changed.includes(state.file);
  const bits = [
    `<span class="meta">branch ${g.branch} · last ${escapeHtml(g.last_commit)}</span>`,
  ];
  if (dirty) bits.push(
    `<div class="warn" style="margin-top:8px"><span class="dot off"></span>` +
    `${state.file} is modified but not committed — the daily sync in the cloud still runs ` +
    `the committed version.</div>`);
  else if (g.ahead > 0) bits.push(
    `<div class="warn" style="margin-top:8px"><span class="dot off"></span>` +
    `${g.ahead} commit${g.ahead > 1 ? "s" : ""} not pushed — the cloud pulls from the remote.</div>`);
  else bits.push(
    `<div style="margin-top:8px"><span class="dot on"></span>` +
    `<span class="meta">the cloud is running what you see here</span></div>`);

  // How far behind the cloud is, in events rather than commits - the number that says what
  // the gap actually means. Lives here, not in the panel above: that one is about the edits
  // you have not applied, this one about the apply you have not pushed.
  const head = lastDiff && lastDiff.vs_head;
  if (head) {
    const c = head.counts;
    const lag = c.created + c.deleted + c.updated;
    bits.push(lag
      ? `<div class="meta" style="margin-top:6px">Against the committed settings: ` +
        `<span class="c-add">+${c.created}</span> <span class="c-del">−${c.deleted}</span> ` +
        `<span class="c-mod">~${c.updated}</span> — the daily run would produce ` +
        `a different calendar than the one above until this is pushed.</div>`
      : `<div class="meta" style="margin-top:6px">The committed settings produce the same ` +
        `calendar, so the daily run agrees with what you see.</div>`);
  } else if (lastDiff && lastDiff.vs_head_error) {
    bits.push(`<div class="meta" style="margin-top:6px">Cannot compare with the committed ` +
              `settings: ${escapeHtml(lastDiff.vs_head_error)}</div>`);
  }

  box.innerHTML = bits.join("");

  if (dirty || g.ahead > 0) {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:10px;margin-top:11px;align-items:center";
    const msg = document.createElement("input");
    msg.type = "text";
    msg.value = dirty ? `Update ${state.file}` : "";
    msg.placeholder = "commit message";
    msg.style.maxWidth = "420px";
    msg.disabled = !dirty;
    const btn = document.createElement("button");
    btn.textContent = dirty ? "Commit and push" : "Push";
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "working…";
      try {
        const out = await call("/api/commit", {message: msg.value, push: true});
        $("gitlog").style.display = "block";
        $("gitlog").textContent = out.output;
        state.git = out.git;
        if (!out.ok) showError(`git ${out.failed_at} failed — see the log below.`);
        else showError("");
        renderGit();
      } catch (e) { showError(e.message); btn.disabled = false; btn.textContent = "Commit and push"; }
    });
    row.append(msg, btn);
    box.appendChild(row);
  }
}

function changed() {
  const dirty = !eq(draft, state.settings);
  $("dirty").innerHTML = dirty
    ? `<span class="dot off"></span>unsaved edits in this page`
    : `<span class="dot on"></span>no unsaved edits`;
  $("save").disabled = !dirty;
  $("discard").disabled = !dirty;
  renderCourses();            // checkboxes can change which rows look active
  clearTimeout(diffTimer);
  diffTimer = setTimeout(refreshDiff, 180);
}

async function refreshDiff() {
  try {
    renderDiff(await call("/api/diff", {settings: draft}));
    showError("");
  } catch (e) { showError(e.message); }
}

function renderAll() {
  renderHeader(); renderCourses(); renderSwitches(); renderGit();
  renderCounts(); renderBoard();     // draw the calendar now; the diff arrives shortly
  changed();
}

// ---- actions ---------------------------------------------------------------
async function load() {
  state = await call("/api/state");
  draft = clone(state.settings);
  renderAll();
}

$("save").addEventListener("click", async () => {
  $("save").disabled = true;
  try {
    const out = await call("/api/save", {settings: draft, mtime: state.mtime});
    state = out.state;
    draft = clone(state.settings);
    renderAll();
    const names = Object.keys(out.changed);
    showError("");
    $("notice").insertAdjacentHTML("afterbegin",
      `<div class="warn">Written to ${state.file}: ${names.join(", ") || "nothing"}.</div>`);
  } catch (e) {
    showError(e.message + (e.data && e.data.reload ? "" : ""));
    $("save").disabled = false;
  }
});

$("discard").addEventListener("click", () => { draft = clone(state.settings); renderAll(); });

function stepMonth(by) {
  const months = monthsOf(boardRows()).map((m) => m.key);
  const at = months.indexOf(shownMonth);
  const next = months[Math.min(months.length - 1, Math.max(0, at + by))];
  if (next) { shownMonth = next; renderBoard(); }
}
$("prevMonth").addEventListener("click", () => stepMonth(-1));
$("nextMonth").addEventListener("click", () => stepMonth(1));

$("viewToggle").addEventListener("click", () => {
  asList = !asList;
  $("grid").hidden = asList;
  $("changes").hidden = !asList;
  for (const id of ["prevMonth", "nextMonth"]) $(id).disabled = asList;
  $("viewToggle").textContent = asList ? "As a month" : "As a list";
});

$("refresh").addEventListener("click", async () => {
  const btn = $("refresh");
  btn.disabled = true; btn.textContent = "fetching…";
  try { state = await call("/api/refresh", {}); draft = clone(state.settings); renderAll(); showError(""); }
  catch (e) { showError(e.message); }
  finally { btn.disabled = false; btn.textContent = "Refresh data"; }
});

load().catch((e) => showError("Could not load: " + e.message));
</script>
</body>
</html>
