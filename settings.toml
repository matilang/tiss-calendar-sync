# TISS sync settings. This file IS committed - that is the point of it.
#
# Everything here is reviewable configuration: which courses, what they are called, which
# reminders, what gets pruned. The two private values - the iCal URL and the calendar id -
# live in .secrets.toml, which is git-ignored, or in the environment. So adding a course
# is an ordinary commit, with a date and a reason on it, and the token is not involved.
#
# Run with:  python tiss_sync.py sync          (this file is the default)
#
# TOML note: every bare key below must stay above the first [section] header. A bare key
# written after [retention] would silently become retention.<key> instead.

# Which set of events on the calendar this file owns. The cleanup pass only deletes events
# carrying this profile's tag (tiss_sync-config), so the TISS and TUWEL syncs can share
# one calendar without deleting each other's events.
#
# Do not change this. It is "config" rather than "tiss" for a dull historical reason - the
# tag used to be taken from the file name, and the file was config.toml. Renaming the
# profile now would orphan every event already on the calendar: they would keep the old
# tag, no sync would own them, and nothing would ever clean them up.
profile = "config"

# Courses to keep: course numbers (best) or a unique part of the title.
# Empty [] = keep everything inside the semester window.
courses = [
  "194.187",      # VU Advanced Software Engineering
  "186.814",      # VU Algorithmics
  "192.174",      # VU Machine Learning for Optimization
  "192.161",      # VU Management of Graph Data
  "no lectures",  # keeps the TISS holiday / break markers
  "192.216",      # VU The Essentials of AI
]

# Events whose title or CATEGORIES contain any of these are dropped (case-insensitive).
exclude_keywords = ["Sprechstunde"]

# Hide exercise slots you cannot attend yet.
#
# Before you pick an exercise group, TISS publishes the whole span the groups run in -
# 194.187 lists Friday 09:00-19:00 twice, once per room (FAV EG A and FAV EG C) - even
# though your actual slot will be a single hour in a single room. Those blocks are
# useless on a calendar, so any timed event at least this long is treated as an
# unregistered placeholder and skipped. Real lectures here run 1-2 h, the placeholders
# run 10 h, so the threshold is not close to anything genuine.
#
# Once you register for a group, TISS puts your real 1 h slot in the feed and the next
# sync adds it automatically. Set to 0 to disable this and see everything.
placeholder_min_hours = 4

# If two events remain that share a course, title and exact time, merge them into one
# and list both rooms. Nothing in the current feed needs this, but it keeps a genuine
# duplicate from showing up twice.
merge_parallel_rooms = true

[retention]
# A daily sync otherwise leaves every lecture you have already attended on the
# calendar, plus reminders for deadlines long gone. Prune those.
prune_past = true
# ...but keep these even once they are over, so the dates stay available to look up.
# Exam dates are worth looking back at; a lecture you sat through is not.
keep_past_kinds = ["exam"]
# Matched as words, not as fragments: "Test" keeps "Test 2" and not "Latest news".
#
# "Exercise" used to be in this list and had to go. Every exercise slot of a course with
# named groups is described "Exercises Group B", so the keyword matched all of them and
# every exercise that had already happened stayed on the calendar for good. 192.216 left
# three behind within a week of being added. The exercise dates are on the TISS course
# page if they are ever needed; they do not belong on a calendar of what is still to come.
keep_past_keywords = ["Q&A", "Q & A", "Test", "Prüfung"]

[exercises]
# Telling exercise slots apart from lectures, and showing them differently.
#
# Two things have to be recognised, and only one of them says "exercise" anywhere.
# Before you register, TISS publishes the whole span the groups run in and calls it
# "Exercise sessions" - those are matched by the keywords below, and dropped anyway by
# placeholder_min_hours because they run ten hours. Once you are registered, the slot
# that appears is named after the group and the hour instead:
#
#     194.187 Advanced Software Engineering 3_11:00-12:00
#
# No keyword can catch that, so classify.py also matches that shape. This is what was
# wrong until 2026-10-05: the registered slot reached the calendar as "VU ASE", sitting
# among the lectures with nothing to distinguish it.
#
# What counts as an exercise by keyword. Q&A sessions deliberately do not match: they are
# not exercises and keep the ordinary lecture treatment.
keywords = ["Exercise", "Übung", "Uebung"]
# An exercise slot of a VU is still an Übung, so the leading type code is swapped:
# "VU ASE" -> "UE ASE". The course stays the same course - only the type changes, because
# that is the part that differs. Set to "" to leave titles alone.
type_code = "UE"
# Google colour 7, Peacock. Distinct from the exam red, the registration banana and the
# TUWEL tangerine, so one glance at the week separates exercises from lectures.
# Set to "" for no colour.
color_id = "7"

[titles]
# Calendar titles, keyed by course number. The number itself never appears in the
# title - you know your own courses - and a long name can be shortened here.
# A course with no entry keeps its TISS name minus the number.
# These also name the exams: "EXAM VU ASE Test 1" instead of "EXAM 194.187 Test 1".
"194.187" = "VU ASE"        # Advanced Software Engineering
"192.161" = "VU MoGD"       # Management of Graph Data
"186.814" = "VU Algorithmics"   # already short enough
"192.174" = "VU ML4Opt"     # Machine Learning for Optimization
"193.219" = "PR HAI"        # Human-agent Interaction
"192.216" = "VU EoAI"

[groups]
# Which exercise group is yours, per course number.
#
# Most courses need no entry. TISS normally puts only the group you registered for in the
# feed - 194.187 sends group 3 and nothing else - so there is nothing to choose.
#
# A few courses attach the appointments to the course instead of to the group, and then
# everybody's slots arrive in everybody's feed. 192.216 is one: all three of its groups
# are in the feed whether you registered or not, so without an entry here two thirds of
# its exercise slots on the calendar are other people's. Nothing in the feed says which
# group is yours, and the course page only says so to someone logged in, so this is the
# one thing that has to be stated rather than discovered.
#
# The value is read loosely - "B", "b", "Group B" and "Exercises Group B" all mean the
# same group, as do "3" and "3_11:00-12:00" - so whatever you copy out of TISS works.
# An event that names no group at all is never dropped, so this cannot hide a lecture.
#
# Left empty on purpose: picking a group for someone removes the other groups' slots from
# their calendar, and guessing wrong removes theirs. Pick it in the Group column of
# `python tiss_sync.py ui`, which lists the groups the feed actually has and how many
# events each one would take away.
#
#   "192.216" = "B"
"192.216" = "B"

[semester]
# Only events inside this window are synced. Exams and registration deadlines from
# [scrape] are exempt: a retake often falls outside the lecture window.
start = "2026-10-01"
end   = "2027-02-28"

[scrape]
# Course pages carry what the iCal feed does not: exam dates, exam registration
# windows, and course / exercise-group registration deadlines. These work even for
# courses you are not registered for yet.
courses = [
  "186814",   # Algorithmics              - 3 exams
  "194187",   # Advanced SE               - 3 tests, 16 exercise groups
  "192161",   # Management of Graph Data  - 2 exams + 2 re-exams
  "192174",   # ML for Optimization       - no exams listed
  "193219",   # Human-agent Interaction   - registration closes 09.10.2026 17:00
  "192216",   # The Essentials of AI
]
semester = "2026W"
# Also remind before each registration window *closes*, not just when it opens.
registration_close_reminder = true
# Course and exercise-group sign-up is done, so those reminders are switched off.
# Exam registration windows open from November onwards, so they stay.
# Put "course" / "group" back in the list to bring them back.
registration_kinds = ["exam", "group"]

[reminders]
lecture_minutes_before = [15]
# Exams / tests / submissions: 3 days and 1 day before
exam_minutes_before = [4320, 1440]
exam_keywords = ["Prüfung", "Exam", "Test", "Klausur", "Abgabe", "Deadline"]
exam_color_id = "11"   # red
# Registration: a day ahead so you can plan, and again the moment it opens.
registration_minutes_before = [1440, 0]
# Exercise groups are first-come-first-served and open at a published hour, so a
# day-early nudge is useless - notify exactly when sign-up opens.
group_registration_minutes_before = [0]
registration_color_id = "5"   # banana, distinct from the red exams
