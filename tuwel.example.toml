# Second config for TUWEL (Moodle) - assignment deadlines, quizzes, submissions.
# Copy to tuwel.toml, paste your export URL, then:  python tiss_sync.py sync -c tuwel.toml
#
# Where the URL comes from (TUWEL does not show it by default):
#   1. tuwel.tuwien.ac.at -> Calendar
#   2. bottom of the page -> "Export calendar"
#   3. Export: "Events related to courses"   (not "All events" - that adds noise)
#      Period: "Custom range" -> 26.09.2026 to 01.10.2027.
#      A full year beats "next 60 days": past deadlines stay in the feed so the sync
#      never deletes them, and next year's courses do not exist yet so they add no
#      noise. Check the generated URL actually carries the range (time_start/time_end
#      or preset_time=custom) - if it fell back to a preset, the year is not in it.
#   4. click "Get calendar URL" and copy what it shows. It looks like:
#      https://tuwel.tuwien.ac.at/calendar/export_execute.php?userid=12345&authtoken=abc...&preset_what=courses&preset_time=recentupcoming
#
# The authtoken is a password-equivalent - treat tuwel.toml like config.toml and never commit it.
#
# Why a separate config rather than adding the URL to config.toml: tiss_sync tags events
# with the config's filename (tiss_sync-tuwel vs tiss_sync-config), and its cleanup pass
# only deletes events carrying its own tag. Two configs therefore never delete each
# other's events, and you can drop either source without touching the other.

# TUWEL titles are course names, not TISS numbers like 186.814, so filter by title
# fragments. Leave [] to keep every deadline from every TUWEL course you are in.
courses = []

# TUWEL emits a lot of low-value chatter; drop what you do not want to see.
exclude_keywords = []

[tiss]
# Despite the section name this is just "the iCal source" - any .ics URL works.
ical_url = "https://tuwel.tuwien.ac.at/calendar/export_execute.php?userid=PASTE&authtoken=PASTE&preset_what=courses&preset_time=recentupcoming"

[semester]
# Match the export's custom range, otherwise this filter throws away what the feed took
# the trouble to include. With a full year in the feed nothing falls out of it mid-term,
# so the cleanup pass never deletes a deadline that still exists in TUWEL.
start = "2026-09-26"
end   = "2027-10-01"

[google]
# Same calendar is fine - the per-config tag keeps the two syncs from fighting.
calendar_id = "xxxxxxxx@group.calendar.google.com"

[reminders]
# Deadlines are the whole point here, so treat everything as exam-like:
# a reminder 3 days before and again 1 day before.
lecture_minutes_before = [1440]
exam_minutes_before = [4320, 1440]
exam_keywords = ["Abgabe", "Deadline", "Submission", "due", "Quiz", "Test", "Prüfung", "Exam"]
exam_color_id = "6"   # orange, so TUWEL deadlines stand out from TISS lectures
